name: Apply CI fix
on:
  push:
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'fix(ci): sort imports and normalize workflow policy') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
      - name: Apply CI fix
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/ci-fix.patch
          git apply --binary /tmp/ci-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policies/pipeline.rego tests/unit/test_backend.py
          git diff --cached --check
          git commit -m "fix(ci): sort imports and normalize workflow policy"
          git push origin "HEAD:$GITHUB_REF_NAME"
