name: Apply compliance plan patch
on:
  push:
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'feat: complete compliance') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
      - name: Apply and publish plan changes
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/compliance.patch
          git apply --binary /tmp/compliance.patch
          terraform -chdir=terraform init -backend=false -input=false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete compliance and single-node resilience plan"
          git push origin "HEAD:$GITHUB_REF_NAME"
