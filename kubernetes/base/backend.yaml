apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-backend
  labels:
    app.kubernetes.io/name: bookstore-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-backend
    spec:
      containers:
        - name: backend
          image: crpi-guf725ppv0myjkdj-vpc.cn-hangzhou.personal.cr.aliyuncs.com/online-bookstore/bookstore-backend:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-backend
spec:
  selector:
    app.kubernetes.io/name: bookstore-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
