name: Online Book Store CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  kubernetes-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.6
      - name: Render all environment overlays
        run: |
          for environment in development test perf staging production; do
            kubectl kustomize "kubernetes/overlays/${environment}" > "/tmp/${environment}.yaml"
            grep -q 'kind: Deployment' "/tmp/${environment}.yaml"
            grep -q 'kind: Ingress' "/tmp/${environment}.yaml"
          done

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v tests/unit

  code-quality:
    name: Ruff code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.0
      - name: Check Python lint
        run: ruff check backend tests
      - name: Check Python formatting
        run: ruff format --check backend tests

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error "${base_url}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output "${RUNNER_TEMP}/gitleaks-checksums.txt"
          (cd "${RUNNER_TEMP}" && grep "${archive}" gitleaks-checksums.txt | sha256sum --check --status)
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/gitleaks-bin"

      - name: Detect secrets in the checked-out repository
        run: |
          "${RUNNER_TEMP}/gitleaks-bin" detect \
            --source "${GITHUB_WORKSPACE}" \
            --no-git \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --redact \
            --no-banner

  trivy:
    name: Trivy filesystem and image scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --silent --show-error "${base_url}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error "${base_url}/trivy_${TRIVY_VERSION}_checksums.txt" --output "${RUNNER_TEMP}/trivy-checksums.txt"
          (cd "${RUNNER_TEMP}" && grep "${archive}" trivy-checksums.txt | sha256sum --check --status)
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/trivy" "${RUNNER_TEMP}/trivy-bin"

      - name: Scan source, Terraform, and Kubernetes configuration
        run: |
          "${RUNNER_TEMP}/trivy-bin" fs . \
            --skip-dirs .git \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      - name: Build images for vulnerability scanning
        run: |
          docker build --tag "bookstore-backend:${GITHUB_SHA}" backend
          docker build --tag "bookstore-frontend:${GITHUB_SHA}" frontend

      - name: Scan backend image
        run: |
          "${RUNNER_TEMP}/trivy-bin" image "bookstore-backend:${GITHUB_SHA}" \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      - name: Scan frontend image
        run: |
          "${RUNNER_TEMP}/trivy-bin" image "bookstore-frontend:${GITHUB_SHA}" \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

  opa:
    name: OPA Kubernetes policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.6

      - name: Render all environment manifests with immutable image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rendered"
          for environment in development test perf staging production; do
            kubectl kustomize "kubernetes/overlays/${environment}" \
              | sed "s/IMAGE_TAG/${IMAGE_TAG}/g" \
              > "${RUNNER_TEMP}/rendered/${environment}.yaml"
          done

      - name: Install pinned Conftest
        env:
          CONFTEST_VERSION: "0.56.0"
        run: |
          set -euo pipefail
          archive="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          base_url="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl --fail --location --silent --show-error "${base_url}/${archive}" --output "${RUNNER_TEMP}/${archive}"
          curl --fail --location --silent --show-error "${base_url}/checksums.txt" --output "${RUNNER_TEMP}/conftest-checksums.txt"
          (cd "${RUNNER_TEMP}" && grep "${archive}" conftest-checksums.txt | sha256sum --check --status)
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/conftest" "${RUNNER_TEMP}/conftest-bin"

      - name: Enforce OPA policies
        run: |
          "${RUNNER_TEMP}/conftest-bin" test \
            --policy policies \
            --fail-on-warn \
            "${RUNNER_TEMP}/rendered"

      - name: Verify Rego policy unit tests
        run: |
          "${RUNNER_TEMP}/conftest-bin" verify --policy policies

      - name: Enforce workflow policy
        run: |
          "${RUNNER_TEMP}/conftest-bin" test \
            --policy policies \
            --fail-on-warn \
            .github/workflows/ci.yml \
            .github/workflows/kubernetes-deploy.yml \
            .github/workflows/kubernetes-resilience.yml

  container-build:
    needs:
      - backend-test
      - code-quality
      - kubernetes-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: bookstore-backend:${{ github.sha }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: bookstore-frontend:${{ github.sha }}
      - name: Smoke test backend container
        run: |
          docker run --detach --name bookstore-backend --publish 8000:8000 bookstore-backend:${{ github.sha }}
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8000/health
      - name: Smoke test frontend container
        run: |
          docker run --detach --name bookstore-frontend --publish 8080:8080 bookstore-frontend:${{ github.sha }}
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/healthz
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/
      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker rm --force bookstore-backend || true
          docker rm --force bookstore-frontend || true

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - container-build
      - gitleaks
      - trivy
      - opa
      - code-quality
      - kubernetes-manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-guf725ppv0myjkdj.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Mirror monitoring images to Alibaba Cloud Container Registry
        run: |
          docker pull docker.io/grafana/grafana:13.0.1-security-01
          docker tag docker.io/grafana/grafana:13.0.1-security-01 \
            crpi-guf725ppv0myjkdj.cn-hangzhou.personal.cr.aliyuncs.com/online-bookstore/bookstore-backend:grafana-13.0.1-security-01
          docker push \
            crpi-guf725ppv0myjkdj.cn-hangzhou.personal.cr.aliyuncs.com/online-bookstore/bookstore-backend:grafana-13.0.1-security-01
          docker pull registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.0
          docker tag registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.0 \
            crpi-guf725ppv0myjkdj.cn-hangzhou.personal.cr.aliyuncs.com/online-bookstore/bookstore-backend:kube-state-metrics-v2.19.0
          docker push \
            crpi-guf725ppv0myjkdj.cn-hangzhou.personal.cr.aliyuncs.com/online-bookstore/bookstore-backend:kube-state-metrics-v2.19.0
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/xxseehome/cloud-native-online-bookstore-backend:${{ github.sha }}
            crpi-guf725ppv0myjkdj.cn-hangzhou.personal.cr.aliyuncs.com/online-bookstore/bookstore-backend:${{ github.sha }}
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/xxseehome/cloud-native-online-bookstore-frontend:${{ github.sha }}
            crpi-guf725ppv0myjkdj.cn-hangzhou.personal.cr.aliyuncs.com/online-bookstore/bookstore-frontend:${{ github.sha }}
