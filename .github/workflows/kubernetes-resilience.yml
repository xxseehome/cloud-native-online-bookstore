name: Kubernetes Resilience Check

on:
  workflow_dispatch:
    inputs:
      expected_image_sha:
        description: Full 40-character image SHA currently deployed to staging
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
  ALIBABA_CLOUD_REGION_ID: ${{ vars.ALICLOUD_REGION }}
  ALICLOUD_OIDC_PROVIDER_ARN: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
  ALICLOUD_APPLY_ROLE_ARN: ${{ vars.ALICLOUD_APPLY_ROLE_ARN }}
  ECS_INSTANCE_ID: ${{ vars.TF_EXISTING_INSTANCE_ID }}

jobs:
  approval:
    name: Staging approval
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Approve staging resilience check
        run: echo "Staging resilience check approved."

  check:
    name: Verify pod self-healing on the single K3s node
    needs: approval
    runs-on: ubuntu-latest
    environment: terraform-apply
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Validate input and configuration
        shell: bash
        env:
          EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_image_sha must be a full 40-character lowercase hexadecimal SHA."
            exit 1
          }
          for name in ALICLOUD_REGION ALICLOUD_OIDC_PROVIDER_ARN ALICLOUD_APPLY_ROLE_ARN ECS_INSTANCE_ID; do
            [[ -n "${!name}" ]] || {
              echo "::error::Missing GitHub variable: ${name}"
              exit 1
            }
          done

      - name: Authenticate to Alibaba Cloud with OIDC
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ env.ALICLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.ALICLOUD_APPLY_ROLE_ARN }}
          role-session-name: github-kubernetes-resilience
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Install Alibaba Cloud CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/aliyun/aliyun-cli/releases/download/v3.3.18/aliyun-cli-linux-3.3.18-amd64.tgz \
            --output aliyun-cli.tgz
          tar --extract --gzip --file aliyun-cli.tgz
          sudo install aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Delete one pod at a time and verify zero HTTP failures
        shell: bash
        env:
          EXPECTED_IMAGE_SHA: ${{ inputs.expected_image_sha }}
        run: |
          set -euo pipefail

          run_cloud_command() {
            local script="$1"
            local timeout="${2:-120}"
            local command_base64 response invoke_id result status

            command_base64="$(printf '%s' "$script" | base64 --wrap=0)"
            response="$(aliyun ecs RunCommand \
              --RegionId "$ALICLOUD_REGION" \
              --InstanceId.1 "$ECS_INSTANCE_ID" \
              --Type RunShellScript \
              --CommandContent "$command_base64" \
              --ContentEncoding Base64 \
              --Timeout "$timeout" \
              --KeepCommand false)"
            invoke_id="$(jq -r '.InvokeId' <<< "$response")"
            [[ -n "$invoke_id" && "$invoke_id" != null ]]
            echo "Cloud Assistant invocation: ${invoke_id}"

            for attempt in {1..240}; do
              result="$(aliyun ecs DescribeInvocationResults \
                --RegionId "$ALICLOUD_REGION" \
                --InvokeId "$invoke_id" \
                --InstanceId "$ECS_INSTANCE_ID")"
              status="$(jq -r '.Invocation.InvocationResults.InvocationResult[0].InvocationStatus // empty' <<< "$result")"
              case "$status" in
                Success)
                  jq -r '.Invocation.InvocationResults.InvocationResult[0].Output // empty' <<< "$result" | base64 --decode
                  return 0
                  ;;
                Failed|Stopped|Timeout|Error|Cancelled|Terminated|Invalid|Aborted)
                  jq -r '.Invocation.InvocationResults.InvocationResult[0].Output // empty' <<< "$result" | base64 --decode || true
                  jq -r '.Invocation.InvocationResults.InvocationResult[0]' <<< "$result"
                  return 1
                  ;;
              esac
              sleep 5
            done
            echo "::error::Timed out waiting for Cloud Assistant."
            return 1
          }

          resilience_script="$(printf '%s\n' \
            'set -eu' \
            'namespace=bookstore-staging' \
            'expected="'"$EXPECTED_IMAGE_SHA"'"' \
            'systemctl is-enabled k3s' \
            'systemctl is-active --quiet k3s' \
            'for deployment in bookstore-backend bookstore-frontend; do k3s kubectl rollout status deployment/$deployment -n "$namespace" --timeout=300s; ready=$(k3s kubectl get deployment "$deployment" -n "$namespace" -o jsonpath="{.status.readyReplicas}"); test "${ready:-0}" -ge 2; images=$(k3s kubectl get deployment "$deployment" -n "$namespace" -o jsonpath="{.spec.template.spec.containers[*].image}"); printf "%s" "$images" | grep -q "$expected"; done' \
            'probe() { curl --fail --silent --show-error --header "Host: staging.bookstore.example.com" http://127.0.0.1/ >/dev/null; curl --fail --silent --show-error --header "Host: staging.bookstore.example.com" http://127.0.0.1/health >/dev/null; curl --fail --silent --show-error --header "Host: staging.bookstore.example.com" http://127.0.0.1/api/books >/dev/null; }' \
            'failures=/tmp/bookstore-resilience-http-failures; : > "$failures"' \
            '(for attempt in $(seq 1 90); do if ! probe; then echo "$attempt" >> "$failures"; fi; sleep 1; done) &' \
            'probe_pid=$!' \
            'delete_one() { deployment="$1"; pod=$(k3s kubectl get pods -n "$namespace" -l "app.kubernetes.io/name=$deployment" -o jsonpath="{.items[0].metadata.name}"); test -n "$pod"; echo "Deleting $pod"; k3s kubectl delete pod "$pod" -n "$namespace" --wait=true; k3s kubectl rollout status deployment/$deployment -n "$namespace" --timeout=300s; ready=$(k3s kubectl get deployment "$deployment" -n "$namespace" -o jsonpath="{.status.readyReplicas}"); test "${ready:-0}" -ge 2; }' \
            'delete_one bookstore-backend' \
            'delete_one bookstore-frontend' \
            'wait "$probe_pid"' \
            'if test -s "$failures"; then echo "HTTP probe failures:"; cat "$failures"; exit 1; fi' \
            'echo "Staging workload self-healing passed with zero HTTP failures."' \
            'k3s kubectl get deployment,pods,service,ingress -n "$namespace"')"
          run_cloud_command "$resilience_script" 1200
