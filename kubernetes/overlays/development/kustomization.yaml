apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookstore-dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - target:
      kind: Ingress
      name: bookstore
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.bookstore.example.com
