name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed plan after environment approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-shared-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
  ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
  ALICLOUD_OIDC_PROVIDER_ARN: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
  ALICLOUD_PLAN_ROLE_ARN: ${{ vars.ALICLOUD_PLAN_ROLE_ARN }}
  ALICLOUD_APPLY_ROLE_ARN: ${{ vars.ALICLOUD_APPLY_ROLE_ARN }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: terraform-plan
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_region: ${{ vars.ALICLOUD_REGION }}
      TF_VAR_availability_zones: ${{ vars.TF_AVAILABILITY_ZONES }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR }}
      TF_VAR_vswitch_cidrs: ${{ vars.TF_VSWITCH_CIDRS }}
      TF_VAR_ssh_ingress_cidrs: ${{ vars.TF_SSH_INGRESS_CIDRS }}
      TF_VAR_k3s_api_ingress_cidrs: ${{ vars.TF_K3S_API_INGRESS_CIDRS }}
      TF_VAR_instance_type: ${{ vars.TF_INSTANCE_TYPE }}
      TF_VAR_image_id: ${{ vars.TF_IMAGE_ID }}
      TF_VAR_system_disk_category: ${{ vars.TF_SYSTEM_DISK_CATEGORY }}
      TF_VAR_internet_max_bandwidth_out: ${{ vars.TF_INTERNET_MAX_BANDWIDTH_OUT }}
      TF_VAR_oss_bucket_name: ${{ vars.TF_OSS_BUCKET_NAME }}
      TF_VAR_enable_alb: ${{ vars.TF_ENABLE_ALB }}
      TF_VAR_enable_slb: ${{ vars.TF_ENABLE_SLB || 'false' }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Restrict deployments to main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Check required configuration
        shell: bash
        run: |
          missing=0
          for name in \
            TF_STATE_BUCKET TF_STATE_KEY TF_STATE_REGION \
            ALICLOUD_REGION \
            ALICLOUD_OIDC_PROVIDER_ARN ALICLOUD_PLAN_ROLE_ARN \
            ALICLOUD_APPLY_ROLE_ARN \
            TF_VAR_availability_zones TF_VAR_vpc_cidr TF_VAR_vswitch_cidrs \
            TF_VAR_ssh_ingress_cidrs TF_VAR_k3s_api_ingress_cidrs \
            TF_VAR_instance_type TF_VAR_image_id TF_VAR_system_disk_category \
            TF_VAR_internet_max_bandwidth_out \
            TF_VAR_oss_bucket_name TF_VAR_enable_alb TF_VAR_enable_slb TF_VAR_ssh_public_key; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub configuration: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"

      - name: Authenticate to Alibaba Cloud with OIDC
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ env.ALICLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.ALICLOUD_PLAN_ROLE_ARN }}
          role-session-name: github-terraform-plan
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Initialize encrypted remote state
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="acl=private"

      - name: Create execution plan
        run: terraform plan -out=tfplan

      - name: Add plan to the run summary
        run: |
          {
            echo "### Terraform plan"
            echo '```text'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}-${{ github.run_id }}
          path: terraform/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Approval and apply
    if: ${{ inputs.apply && needs.plan.result == 'success' }}
    needs: plan
    runs-on: ubuntu-latest
    environment: terraform-apply
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout the planned revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Restrict deployments to main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"

      - name: Authenticate to Alibaba Cloud with OIDC
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ env.ALICLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.ALICLOUD_APPLY_ROLE_ARN }}
          role-session-name: github-terraform-apply
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Initialize encrypted remote state
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="acl=private"

      - name: Download the approved plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}-${{ github.run_id }}
          path: terraform

      - name: Apply the approved plan
        run: terraform apply -auto-approve tfplan
