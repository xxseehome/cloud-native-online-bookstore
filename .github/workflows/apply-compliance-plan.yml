name: Apply compliance plan patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Apply and publish plan changes
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/compliance.patch
          git apply --binary /tmp/compliance.patch
          git rm --ignore-unmatch .github/workflows/apply-compliance-plan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete compliance and single-node resilience plan"
          git push origin "HEAD:$GITHUB_REF_NAME"
