name: Kubernetes Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: Immutable image tag produced by the main CI workflow
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: kubernetes-${{ inputs.environment }}
  cancel-in-progress: false

env:
  MONITORING_CHART_VERSION: "86.0.0"
  ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
  ALIBABA_CLOUD_REGION_ID: ${{ vars.ALICLOUD_REGION }}
  ALICLOUD_OIDC_PROVIDER_ARN: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
  ALICLOUD_APPLY_ROLE_ARN: ${{ vars.ALICLOUD_APPLY_ROLE_ARN }}
  ECS_INSTANCE_ID: ${{ vars.TF_EXISTING_INSTANCE_ID }}

jobs:
  approval:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Approve target environment
        run: echo "Deployment to ${{ inputs.environment }} approved."

  deploy:
    needs: approval
    runs-on: ubuntu-latest
    environment: terraform-apply
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Restrict deployments to main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Validate inputs and configuration
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::image_tag must be a full 40-character Git commit SHA."
            exit 1
          }
          for name in ALICLOUD_REGION ALICLOUD_OIDC_PROVIDER_ARN ALICLOUD_APPLY_ROLE_ARN ECS_INSTANCE_ID; do
            [[ -n "${!name}" ]] || {
              echo "::error::Missing GitHub variable: ${name}"
              exit 1
            }
          done

      - name: Render and validate manifests
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          kubectl kustomize "kubernetes/overlays/${DEPLOY_ENVIRONMENT}" > rendered.yaml
          sed -i "s/IMAGE_TAG/${IMAGE_TAG}/g" rendered.yaml
          ! grep -q IMAGE_TAG rendered.yaml

      - name: Render monitoring stack
        run: |
          curl --fail --location --silent --show-error \
            https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz \
            --output helm.tgz
          tar --extract --gzip --file helm.tgz
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm show crds oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --version "$MONITORING_CHART_VERSION" > monitoring-crds.yaml
          helm template monitoring oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --version "$MONITORING_CHART_VERSION" \
            --namespace monitoring \
            --create-namespace \
            --values monitoring/values.yaml > monitoring-rendered.yaml

      - name: Authenticate to Alibaba Cloud with OIDC
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ env.ALICLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ env.ALICLOUD_APPLY_ROLE_ARN }}
          role-session-name: github-kubernetes-deploy
          role-session-expiration: 1800
          audience: sts.aliyuncs.com

      - name: Install Alibaba Cloud CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/aliyun/aliyun-cli/releases/download/v3.3.18/aliyun-cli-linux-3.3.18-amd64.tgz \
            --output aliyun-cli.tgz
          tar --extract --gzip --file aliyun-cli.tgz
          sudo install aliyun /usr/local/bin/aliyun
          aliyun version

      - name: Deploy through ECS Cloud Assistant
        shell: bash
        run: |
          set -euo pipefail

          run_cloud_command() {
            local script="$1"
            local timeout="${2:-120}"
            local command_base64 response invoke_id result status

            command_base64="$(printf '%s' "$script" | base64 --wrap=0)"
            response="$(aliyun ecs RunCommand \
              --RegionId "$ALICLOUD_REGION" \
              --InstanceId.1 "$ECS_INSTANCE_ID" \
              --Type RunShellScript \
              --CommandContent "$command_base64" \
              --ContentEncoding Base64 \
              --Timeout "$timeout" \
              --KeepCommand false)"
            invoke_id="$(jq -r '.InvokeId' <<< "$response")"
            [[ -n "$invoke_id" && "$invoke_id" != null ]]
            echo "Cloud Assistant invocation: ${invoke_id}"

            for attempt in {1..240}; do
              result="$(aliyun ecs DescribeInvocationResults \
                --RegionId "$ALICLOUD_REGION" \
                --InvokeId "$invoke_id" \
                --InstanceId "$ECS_INSTANCE_ID")"
              status="$(jq -r '.Invocation.InvocationResults.InvocationResult[0].InvocationStatus // empty' <<< "$result")"
              case "$status" in
                Success)
                  jq -r '.Invocation.InvocationResults.InvocationResult[0].Output // empty' <<< "$result" | base64 --decode
                  return 0
                  ;;
                Failed|Stopped|Timeout|Error|Cancelled|Terminated|Invalid|Aborted)
                  jq -r '.Invocation.InvocationResults.InvocationResult[0].Output // empty' <<< "$result" | base64 --decode || true
                  jq -r '.Invocation.InvocationResults.InvocationResult[0]' <<< "$result"
                  return 1
                  ;;
              esac
              sleep 5
            done
            echo "::error::Timed out waiting for Cloud Assistant."
            return 1
          }

          tar --create --gzip --file deploy-manifests.tgz \
            rendered.yaml monitoring-crds.yaml monitoring-rendered.yaml
          payload_base64="$(base64 --wrap=0 deploy-manifests.tgz)"
          run_cloud_command 'rm -f /tmp/deploy-manifests.tgz.b64'
          while IFS= read -r chunk; do
            run_cloud_command "printf '%s' '${chunk}' >> /tmp/deploy-manifests.tgz.b64"
          done < <(fold --width=18000 <<< "$payload_base64")

          deploy_script="$(printf '%s\n' \
            'set -eu' \
            'base64 --decode /tmp/deploy-manifests.tgz.b64 > /tmp/deploy-manifests.tgz' \
            'tar --extract --gzip --file /tmp/deploy-manifests.tgz --directory /tmp' \
            'mv /tmp/rendered.yaml /tmp/bookstore.yaml' \
            'mv /tmp/monitoring-rendered.yaml /tmp/monitoring.yaml' \
            'k3s kubectl apply -f /tmp/bookstore.yaml' \
            'k3s kubectl create namespace monitoring --dry-run=client -o yaml | k3s kubectl apply -f -' \
            'k3s kubectl apply --server-side -f /tmp/monitoring-crds.yaml' \
            'k3s kubectl wait --for=condition=Established --timeout=180s -f /tmp/monitoring-crds.yaml' \
            'k3s kubectl apply --server-side --force-conflicts -f /tmp/monitoring.yaml' \
            'namespace=$(awk '\''$1 == "namespace:" { print $2; exit }'\'' /tmp/bookstore.yaml)' \
            'for pod in $(k3s kubectl get pods -n "$namespace" -o custom-columns=NAME:.metadata.name,IMAGE:.spec.containers[0].image --no-headers | awk '\''$2 ~ /^ghcr[.]io\// { print $1 }'\''); do k3s kubectl delete pod "$pod" -n "$namespace" --force --grace-period=0 --ignore-not-found; done' \
            'k3s kubectl rollout status deployment/bookstore-backend -n "$namespace" --timeout=300s || { k3s kubectl get pods -n "$namespace" -o wide; k3s kubectl get events -n "$namespace" --sort-by=.lastTimestamp; exit 1; }' \
            'k3s kubectl rollout status deployment/bookstore-frontend -n "$namespace" --timeout=300s || { k3s kubectl get pods -n "$namespace" -o wide; k3s kubectl get events -n "$namespace" --sort-by=.lastTimestamp; exit 1; }' \
            'curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1/ >/dev/null' \
            'curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1/health' \
            'curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1/api/books >/dev/null' \
            'echo "HTTP smoke tests passed."' \
            'k3s kubectl delete pod -n monitoring -l app.kubernetes.io/name=grafana --force --grace-period=0 --ignore-not-found' \
            'k3s kubectl delete replicaset -n monitoring -l app.kubernetes.io/name=grafana --force --grace-period=0 --ignore-not-found' \
            'k3s kubectl delete deployment monitoring-grafana -n monitoring --ignore-not-found --cascade=background --wait=true' \
            'for attempt in $(seq 1 30); do k3s kubectl apply --server-side --force-conflicts -f /tmp/monitoring.yaml >/dev/null; k3s kubectl get deployment monitoring-grafana -n monitoring >/dev/null 2>&1 && break; sleep 2; done' \
            'k3s kubectl get deployment monitoring-grafana -n monitoring >/dev/null' \
            'k3s kubectl rollout status deployment/monitoring-operator -n monitoring --timeout=600s' \
            'k3s kubectl rollout status deployment/monitoring-grafana -n monitoring --timeout=600s' \
            'k3s kubectl rollout status deployment/monitoring-kube-state-metrics -n monitoring --timeout=600s' \
            'k3s kubectl rollout status daemonset/monitoring-prometheus-node-exporter -n monitoring --timeout=600s' \
            'k3s kubectl rollout status statefulset/prometheus-monitoring-prometheus -n monitoring --timeout=600s' \
            'grafana_pod=$(k3s kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana -o jsonpath="{.items[0].metadata.name}")' \
            'k3s kubectl exec -n monitoring "$grafana_pod" -- wget -qO- http://127.0.0.1:3000/api/health' \
            'echo "Monitoring smoke test passed."' \
            'k3s kubectl get pods,service,ingress -n monitoring' \
            'k3s kubectl get deployment,service,ingress -n "$namespace"')"
          run_cloud_command "$deploy_script" 1200
