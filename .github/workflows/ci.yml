name: Online Book Store CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -v tests/unit

  container-build:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          push: false
          tags: bookstore-backend:${{ github.sha }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          push: false
          tags: bookstore-frontend:${{ github.sha }}
      - name: Smoke test backend container
        run: |
          docker run --detach --name bookstore-backend --publish 8000:8000 bookstore-backend:${{ github.sha }}
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health
      - name: Smoke test frontend container
        run: |
          docker run --detach --name bookstore-frontend --publish 8080:80 bookstore-frontend:${{ github.sha }}
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/
      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker rm --force bookstore-backend || true
          docker rm --force bookstore-frontend || true
