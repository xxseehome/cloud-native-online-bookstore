apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-frontend
  labels:
    app.kubernetes.io/name: bookstore-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bookstore-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookstore-frontend
    spec:
      containers:
        - name: frontend
          image: crpi-guf725ppv0myjkdj-vpc.cn-hangzhou.personal.cr.aliyuncs.com/online-bookstore/bookstore-frontend:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-frontend
spec:
  selector:
    app.kubernetes.io/name: bookstore-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
